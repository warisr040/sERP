<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sERP 1.0 — simply handle IT ERP</title>
<meta name="description" content="sERP (simply handle IT ERP) — accounting, invoices, payroll and user-revisable tax rules on your own PostgreSQL database.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
:root{
  --font:"Segoe UI Variable Text","Segoe UI Variable","SF Pro Text","Inter","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans Thai",Helvetica,Arial,sans-serif;
  --display:"Segoe UI Variable Display","SF Pro Display","Inter Display","Inter","Segoe UI",system-ui,-apple-system,"Noto Sans Thai",sans-serif;
  --accent:#4f46e5;--accent-2:#7c3aed;--accent-soft:rgba(79,70,229,.09);--accent-line:rgba(79,70,229,.35);
  --chrome:rgba(255,255,255,.78);--chrome-solid:#ffffff;--line:rgba(15,23,42,.07);--line-2:rgba(15,23,42,.13);
  --text:#0f172a;--muted:#667085;--hover:rgba(15,23,42,.045);--field:#ffffff;
  --canvas:#f3f4f9;--glow:rgba(124,58,237,.10);--hi:rgba(255,255,255,.9);
  --shadow:0 1px 1px rgba(15,23,42,.04),0 10px 30px -8px rgba(30,27,75,.14);
  --ok:#059669;--danger:#dc2626;--warn:#d97706;color-scheme:light;
  --c-rev:#4f46e5;--c-rev2:#7c3aed;--c-exp:#059669;--c-exp2:#10b981;
}
[data-theme=dark]{
  --accent:#818cf8;--accent-2:#a78bfa;--accent-soft:rgba(129,140,248,.15);--accent-line:rgba(129,140,248,.45);
  --chrome:rgba(24,26,33,.80);--chrome-solid:#181a21;--line:rgba(255,255,255,.065);--line-2:rgba(255,255,255,.13);
  --text:#e8eaf0;--muted:#98a1b3;--hover:rgba(255,255,255,.055);--field:#11131a;
  --canvas:#0d0f14;--glow:rgba(129,140,248,.12);--hi:rgba(255,255,255,.06);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 14px 36px -10px rgba(0,0,0,.6);
  --ok:#34d399;--danger:#f87171;--warn:#fbbf24;color-scheme:dark;
  --c-rev:#818cf8;--c-rev2:#a78bfa;--c-exp:#34d399;--c-exp2:#6ee7b7;
}
[data-theme=starry]{
  --accent:#8cc8ff;--accent-2:#4f7fe0;--accent-soft:rgba(140,200,255,.14);--accent-line:rgba(140,200,255,.45);
  --chrome:rgba(12,24,58,.84);--chrome-solid:#0c1a3d;--line:rgba(160,190,255,.12);--line-2:rgba(160,190,255,.22);
  --text:#e8ecff;--muted:#9fb0d6;--hover:rgba(160,190,255,.08);--field:#0a1430;
  --canvas:#0a1530;--glow:rgba(140,200,255,.10);--hi:rgba(200,220,255,.07);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 14px 36px -10px rgba(0,0,0,.6);
  --ok:#7dd3fc;--danger:#fca5a5;--warn:#f5d27a;color-scheme:dark;
  --c-rev:#8cc8ff;--c-rev2:#4f7fe0;--c-exp:#f5d27a;--c-exp2:#ffe7a3;
  --canvas-tex:radial-gradient(1.3px 1.3px at 20% 30%,rgba(255,255,255,.55) 60%,transparent 100%) 0 0/83px 79px,radial-gradient(1.1px 1.1px at 65% 70%,rgba(200,225,255,.45) 60%,transparent 100%) 0 0/127px 109px,radial-gradient(1px 1px at 40% 55%,rgba(200,215,255,.42) 60%,transparent 100%) 0 0/61px 67px;
}
[data-theme=forest]{
  --accent:#2f6b3a;--accent-2:#5c8f3c;--accent-soft:rgba(47,107,58,.10);--accent-line:rgba(47,107,58,.4);
  --chrome:rgba(250,248,240,.86);--chrome-solid:#f8f5ec;--line:rgba(47,90,54,.11);--line-2:rgba(47,90,54,.22);
  --text:#1f3324;--muted:#5f7363;--hover:rgba(47,90,54,.06);--field:#fffdf6;
  --canvas:#e3ebdc;--glow:rgba(92,143,60,.12);--hi:rgba(255,255,250,.9);
  --shadow:0 1px 1px rgba(31,51,36,.05),0 10px 30px -8px rgba(31,51,36,.18);
  --ok:#2f6b3a;--danger:#b4413a;--warn:#c07a2c;color-scheme:light;
  --c-rev:#2f6b3a;--c-rev2:#5c8f3c;--c-exp:#c07a2c;--c-exp2:#d99a4e;
  --canvas-tex:radial-gradient(ellipse 50% 40% at 95% 100%,rgba(47,107,58,.14),transparent 70%);
}
[data-theme=burning]{
  --accent:#ff7a33;--accent-2:#ee0979;--accent-soft:rgba(255,122,51,.14);--accent-line:rgba(255,122,51,.45);
  --chrome:rgba(28,18,14,.86);--chrome-solid:#1c120e;--line:rgba(255,140,80,.12);--line-2:rgba(255,140,80,.22);
  --text:#f7e9df;--muted:#c4a796;--hover:rgba(255,140,80,.075);--field:#140c09;
  --canvas:#150e0b;--glow:rgba(255,106,0,.12);--hi:rgba(255,200,160,.06);
  --shadow:0 1px 1px rgba(0,0,0,.35),0 14px 36px -10px rgba(0,0,0,.65);
  --ok:#fbbf24;--danger:#fb7185;--warn:#ffd166;color-scheme:dark;
  --c-rev:#ff7a33;--c-rev2:#ee0979;--c-exp:#ffd166;--c-exp2:#ffe08a;
  --canvas-tex:radial-gradient(ellipse 70% 45% at 50% 115%,rgba(255,106,0,.22),transparent 60%);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px/1.45 var(--font);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1100px 420px at 8% -8%,var(--glow),transparent 62%),radial-gradient(900px 380px at 100% 0%,var(--glow),transparent 60%),var(--canvas-tex,none),var(--canvas)}
#app{position:relative;height:100vh}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glass{background:var(--chrome);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi),var(--shadow)}
.solid{background:var(--chrome-solid);border:1px solid var(--line);box-shadow:var(--shadow)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.r{text-align:right}

/* toolbar */
header{position:absolute;z-index:8;top:14px;left:14px;right:14px;height:56px;display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;border-radius:18px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
header::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:10px;margin-right:10px;white-space:nowrap}
.brand b{font:650 15px/1 var(--display);letter-spacing:-.015em}
.brand small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.logo{width:34px;height:34px;display:grid;place-items:center;filter:drop-shadow(0 4px 10px rgba(10,23,54,.35))}
.logo img{width:34px;height:34px}
.tb{display:flex;align-items:center;gap:2px;padding-left:10px;margin-left:4px;border-left:1px solid var(--line);height:28px}
button.b{height:34px;border:1px solid transparent;background:none;border-radius:10px;padding:0 11px;font:inherit;font-weight:550;color:var(--text);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;line-height:1;transition:background .14s,color .14s,border-color .14s,box-shadow .14s}
button.b:hover{background:var(--hover)}
button.b.on{background:var(--accent-soft);color:var(--accent)}
button.b.ico{width:34px;padding:0;justify-content:center}
button.b.sm{height:30px;padding:0 10px;font-size:12.5px}
button.b.xs{height:26px;padding:0 8px;font-size:12px;border-radius:8px}
button.b.line{border-color:var(--line-2)}
button.b svg{width:17px;height:17px;flex:none;stroke-width:1.8}
button.b.sm svg{width:15px;height:15px}
button.b:disabled{opacity:.35;cursor:default;background:none}
button.b.primary{color:#fff;padding:0 15px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 18px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
button.b.primary:hover{filter:brightness(1.07)}
button.b.primary:disabled{opacity:.45;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
button.b.danger{color:var(--danger)}
button.b.okb{color:var(--ok)}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:12px;background:var(--hover);border:1px solid var(--line)}
.seg button{height:28px;border:0;background:none;border-radius:9px;padding:0 11px;font:inherit;font-weight:550;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,box-shadow .15s}
.seg button svg{width:15px;height:15px;stroke-width:1.9}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--chrome-solid);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12),inset 0 1px 0 var(--hi)}
#tabs button{height:32px;padding:0 13px}
.spacer{flex:1;min-width:8px}
.pill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line-2);background:none;color:var(--text);font:inherit;font-size:12.5px;font-weight:550;cursor:pointer;white-space:nowrap;max-width:170px;flex:none}
.pill span{overflow:hidden;text-overflow:ellipsis}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.pill.ok i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.pill.busy i{background:var(--accent);animation:pulse 1s infinite}
.pill.err i{background:var(--danger)}
@keyframes pulse{50%{opacity:.35}}
.hsel{max-width:210px;height:32px;border:1px solid var(--line-2);border-radius:99px;padding:0 10px;font:inherit;font-size:12.5px;font-weight:550;color:var(--text);background:var(--field);cursor:pointer}
.hdate{height:32px;border:1px solid var(--line-2);border-radius:99px;padding:0 10px;font:inherit;font-size:12.5px;color:var(--text);background:var(--field);font-variant-numeric:tabular-nums}
.hlab{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;white-space:nowrap}

/* hero */
#hero{position:absolute;z-index:6;top:78px;left:14px;right:14px;height:80px;border-radius:18px;display:flex;align-items:center;gap:30px;padding:0 24px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;white-space:nowrap}
#hero::-webkit-scrollbar{display:none}
.pblock{min-width:260px;flex:1 1 auto}
#coName{font:650 22px/1.2 var(--display);letter-spacing:-.02em}
.pmeta{display:flex;align-items:center;gap:12px;margin-top:6px;color:var(--muted);font-size:12.5px}
.kpis{display:flex;gap:28px;flex:none}
.kpi{display:flex;flex-direction:column;gap:5px}
.kpi span{font-size:12px;color:var(--muted)}
.kpi b{font:600 19px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi b small{font:500 12px var(--font);color:var(--muted);margin-left:4px;letter-spacing:0}
.kpi.neg b{color:var(--danger)}
.ringbox{display:flex;align-items:center;gap:13px;flex:none;padding-left:26px;border-left:1px solid var(--line)}
.ring{position:relative;width:56px;height:56px}
.ring svg{display:block;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:650 13px var(--display);font-variant-numeric:tabular-nums}
.ring circle.v{transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1)}
.rtext{display:flex;flex-direction:column;gap:6px}
.rtext span{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:99px;font-weight:600;font-size:11.5px;white-space:nowrap;vertical-align:middle}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.chip.bad{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.chip.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chip.mid{background:var(--hover);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.plain::before{display:none}

/* views */
.view{position:absolute;z-index:1;top:166px;left:14px;right:14px;bottom:14px}
.vbar{height:48px;border-radius:15px;display:flex;align-items:center;gap:6px;padding:0 8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;white-space:nowrap}
.vbar::-webkit-scrollbar{display:none}
.vbar .lab{color:var(--muted);font-size:12.5px;margin:0 2px 0 8px}
.vbar select,.vbar input{height:30px;border:1px solid var(--line-2);border-radius:9px;padding:0 9px;font:inherit;font-size:12.5px;color:var(--text);background:var(--field)}
.vbar input[type=search]{width:220px}
.vbody{position:absolute;top:56px;left:0;right:0;bottom:0;border-radius:18px;overflow:hidden}
.vscroll{position:absolute;inset:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.pad{padding:18px 20px}
#v-dash .vbody{top:0}

/* dashboard */
.dgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;padding:16px}
.card{border:1px solid var(--line);border-radius:16px;background:var(--chrome-solid);padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font:650 14px var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.card h3 small{font:500 12px var(--font);color:var(--muted)}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:1250px){.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
.mini{display:flex;flex-direction:column}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:default}
.mrow:last-child{border-bottom:0}
.mrow.click{cursor:pointer;border-radius:8px;padding:8px 6px}
.mrow.click:hover{background:var(--hover)}
.mrow .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow b{font-weight:600}
.big{font:650 26px/1.1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.taxline{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line-2);font-variant-numeric:tabular-nums}
.taxline:last-child{border-bottom:0}
.chartbox svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:4px;vertical-align:-1px;margin-right:6px}

/* tables */
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.grid th{position:sticky;top:0;z-index:1;background:var(--chrome-solid);text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:10px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.grid th.r,table.grid td.r{text-align:right}
table.grid td{padding:4px 10px;border-bottom:1px solid var(--line);height:40px;font-variant-numeric:tabular-nums}
table.grid tbody tr.click{cursor:pointer}
table.grid tbody tr:hover td{background:var(--hover)}
table.grid tr.sel td{background:var(--accent-soft)}
table.grid tr.sub td{font-weight:650;background:color-mix(in srgb,var(--text) 2.6%,transparent)}
table.grid tr.tot td{font-weight:700;border-top:1.5px solid var(--line-2);border-bottom:0;background:var(--chrome-solid);position:sticky;bottom:0}
table.grid input,table.grid select{width:100%;height:30px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text);font:inherit;padding:0 8px;font-variant-numeric:tabular-nums}
table.grid input:hover,table.grid select:hover{border-color:var(--line-2)}
table.grid input:focus,table.grid select:focus{background:var(--field);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
table.grid input[type=number]{text-align:right;-moz-appearance:textfield;appearance:textfield}
table.grid input::-webkit-inner-spin-button{-webkit-appearance:none}
.code{font:600 12px ui-monospace,"Cascadia Code",Consolas,monospace;color:var(--muted)}
.th2{font-size:11.5px;color:var(--muted)}
.empty{padding:40px 22px;color:var(--muted);text-align:center;line-height:1.6}
.empty b{display:block;font:600 16px var(--display);color:var(--text);margin-bottom:4px}

/* split layouts */
.split{position:absolute;inset:0;display:grid;grid-template-columns:330px 1fr}
.split>.lcol{border-right:1px solid var(--line-2);overflow:auto;scrollbar-width:thin;padding:10px}
.split>.rcol{overflow:auto;scrollbar-width:thin;position:relative}
.sitem{border:1.5px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .14s,box-shadow .14s;background:var(--chrome-solid)}
.sitem:hover{border-color:var(--accent-line)}
.sitem.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sitem .t1{display:flex;align-items:center;gap:8px;font-weight:650}
.sitem .t1 .sp{flex:1}
.sitem .t2{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.shead{display:flex;align-items:center;gap:12px;padding:16px 20px 12px;flex-wrap:wrap}
.shead h2{margin:0;font:650 19px var(--display);letter-spacing:-.02em}
.shead .sp{flex:1}
.stats{display:flex;gap:26px;padding:0 20px 14px;flex-wrap:wrap}
.stats .kpi b{font-size:17px}

/* rules */
.rulecat{padding:14px 20px 0}
.rulecat h4{margin:6px 0 10px;font:650 12px var(--font);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.rule{border:1px solid var(--line);border-radius:14px;background:var(--chrome-solid);margin-bottom:10px;overflow:hidden}
.rule .rh{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}
.rule .rh:hover{background:var(--hover)}
.rule .rh .nm{font-weight:650}
.rule .rh .sp{flex:1}
.vline{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 12px}
.vchip{border:1.5px solid var(--line-2);border-radius:10px;padding:5px 9px;font-size:11.5px;cursor:pointer;background:none;color:var(--text);font-family:inherit;display:flex;flex-direction:column;gap:1px;text-align:left;min-width:108px}
.vchip b{font-size:12px}
.vchip span{color:var(--muted);font-variant-numeric:tabular-nums}
.vchip.approved{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.vchip.inforce{box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent);border-color:var(--ok)}
.vchip.draft,.vchip.submitted{border-style:dashed;border-color:var(--accent)}
.vchip.rejected,.vchip.retired{opacity:.55}
.vchip.on{background:var(--accent-soft)}
.vdetail{border-top:1px solid var(--line);padding:12px 14px;background:color-mix(in srgb,var(--text) 1.5%,transparent)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:5px 12px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums;word-break:break-word}
.ptable{border-collapse:collapse;font-size:12.5px;margin-top:4px}
.ptable td,.ptable th{padding:4px 12px 4px 0;text-align:left;font-variant-numeric:tabular-nums}
.ptable th{color:var(--muted);font-weight:600;font-size:11.5px}
.formula{font:12px ui-monospace,"Cascadia Code",Consolas,monospace;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.drop{display:block;border:2px dashed var(--line-2);border-radius:16px;padding:28px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .14s,background .14s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.drop b{display:block;color:var(--text);font:600 15px var(--display);margin-bottom:4px}
.msgs{font-size:12.5px;line-height:1.55;margin:10px 0}
.msgs div{padding:5px 10px;border-radius:8px;margin-bottom:4px;font-variant-numeric:tabular-nums;white-space:pre-wrap}
.msgs .e{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.msgs .w{background:color-mix(in srgb,var(--warn) 14%,transparent)}
.msgs .c{background:var(--hover);font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:12px}
.msgs .c.add{background:color-mix(in srgb,var(--ok) 12%,transparent)}

/* popovers, menus, modals */
.pop{position:absolute;z-index:30;padding:16px 18px;border-radius:16px;max-height:calc(100vh - 90px);overflow:auto;animation:pop .16s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.985)}}
#themePop{width:350px;top:76px;right:14px}#helpPop{width:470px;top:76px;right:14px}#setPop{width:420px;top:76px;right:14px}
.phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.phead b{font:650 15px var(--display);letter-spacing:-.01em}
.xbtn{border:0;background:none;color:var(--muted);cursor:pointer;border-radius:8px;width:28px;height:28px;font-size:17px;line-height:1;flex:none}
.xbtn:hover{background:var(--hover);color:var(--text)}
.pnote{font-size:12px;color:var(--muted);margin:8px 0;line-height:1.5;white-space:normal}
.ph2{font-weight:600;font-size:12px;color:var(--muted);margin:16px 0 8px}
.thgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.thcard{border:1.5px solid var(--line-2);border-radius:13px;padding:7px;background:none;cursor:pointer;text-align:left;font:inherit;color:var(--text);transition:border-color .14s,box-shadow .14s}
.thcard:hover{border-color:var(--accent-line)}
.thcard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.thcard .prev{height:52px;border-radius:9px;position:relative;overflow:hidden;margin-bottom:7px}
.thcard .prev i{position:absolute;border-radius:4px}
.thcard b{font-size:12.5px;font-weight:600}.thcard .pnote{margin:1px 0 0}
.kbd{font:600 11px ui-monospace,"Cascadia Code",Consolas,monospace;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--field);white-space:nowrap}
#helpPop table{border-collapse:collapse;width:100%;font-size:12.5px}
#helpPop td{padding:7px 2px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
#helpPop tr:last-child td{border-bottom:0}
#helpPop td:first-child{white-space:nowrap;padding-right:14px;font-weight:600}
.mback{position:fixed;inset:0;z-index:35;background:rgba(8,10,20,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,calc(100vw - 28px));max-height:calc(100vh - 40px);overflow:auto;border-radius:20px;padding:20px 22px;animation:pop .18s cubic-bezier(.2,.8,.2,1)}
.modal.wide{width:min(980px,calc(100vw - 28px))}
.modal.mid{width:min(760px,calc(100vw - 28px))}
.mfoot{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:16px}
.mfoot .sp{flex:1}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px;margin-bottom:12px}
.fgrid.two{grid-template-columns:1fr 1fr}
.fgrid label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:550}
.fgrid label.full{grid-column:1/-1}
.fgrid>label{min-width:0}
.fgrid input,.fgrid select,.fgrid textarea{width:100%;min-width:0;height:34px;border:1px solid var(--line-2);border-radius:9px;padding:0 10px;font:inherit;font-size:13px;color:var(--text);background:var(--field);font-weight:400}
.fgrid textarea{height:70px;padding:8px 10px;resize:vertical}
.fgrid input:focus,.fgrid select:focus,.fgrid textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ck{display:flex!important;flex-direction:row!important;align-items:center;gap:8px;color:var(--text)!important}
.ck input,.fgrid .ck input{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none}
.totbox{display:flex;justify-content:flex-end;gap:26px;padding:10px 4px 0;font-variant-numeric:tabular-nums}
.totbox div{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.totbox span{font-size:11.5px;color:var(--muted)}
.totbox b{font:650 16px var(--display)}
.balbar{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:8px 12px;border-radius:10px;margin-top:10px}
.balbar.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.balbar.bad{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.toasts{position:fixed;z-index:60;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:10px 16px;border-radius:12px;font-weight:550;max-width:min(680px,calc(100vw - 40px));animation:pop .18s;pointer-events:auto;white-space:pre-wrap;line-height:1.5}
.toast.err{color:var(--danger)}
.toast.good{color:var(--ok)}
.tag{display:inline-block;font:600 10.5px var(--font);padding:2px 7px;border-radius:6px;background:var(--hover);color:var(--muted);letter-spacing:.02em}
.trace{font-size:12px;margin-top:10px}
.trace td{padding:3px 14px 3px 0}
.payslip{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--field)}
.payslip .ln{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.payslip .ln.t{border-top:1px solid var(--line-2);margin-top:6px;padding-top:8px;font-weight:700}
.tips{border:1px solid var(--line-2);border-radius:12px;padding:10px 14px;background:var(--field);font-size:12.5px;line-height:1.55;margin-top:6px}
.tips ol{margin:6px 0 8px;padding-left:20px}.tips li{margin-bottom:4px}.tips a{color:var(--accent);font-weight:600}
#setup{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(1100px 420px at 8% -8%,var(--glow),transparent 62%),var(--canvas-tex,none),var(--canvas)}
#setup .modal{width:min(660px,calc(100vw - 28px))}
.hero-logo{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.hero-logo img{width:56px;height:56px;filter:drop-shadow(0 6px 14px rgba(10,23,54,.4))}

.bars{display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden;background:var(--line-2);margin-top:6px}

@media (max-width:1100px){.lbl{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .view[hidden]{display:none!important}
  table.grid th{position:static}

<script>
'use strict';
/* =================== basics =================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = 'serp.ui';
const ui = Object.assign({ theme: 'basic', tab: 'dash', user: 'napat', company: 1, asOf: null, docKind: 'AR', payKind: 'runs', taxKind: 'rules', repKind: 'tb' }, (() => { try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) { return {}; } })());
const save = () => { try { localStorage.setItem(LS, JSON.stringify(ui)); } catch (e) { } };
let META = null, STATUS = null;
const money = (v, d = 2) => (v == null || v === '') ? '–' : Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const m0 = v => money(v, 0);
const amt = v => { const n = Number(v || 0); return n ? money(n) : '<span class="muted">–</span>'; };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fdate = s => { if (!s) return '–'; const [y, m, d] = String(s).slice(0, 10).split('-'); return `${+d} ${MON[+m - 1]} ${y}`; };
const fts = s => s ? fdate(s) + ' ' + String(s).slice(11, 16) : '–';
const today = () => new Date().toISOString().slice(0, 10);
const asOf = () => ui.asOf || today();

async function api(path, opt = {}) {
  const h = { 'X-ERP-User': ui.user, 'X-ERP-Company': String(ui.company), 'X-Requested-With': 'sERP' };
  let body = opt.body;
  if (body && !(body instanceof ArrayBuffer) && !(body instanceof Blob)) { h['Content-Type'] = 'application/json'; body = JSON.stringify(body); }
  else if (body) h['Content-Type'] = 'application/octet-stream';
  let r;
  try { r = await fetch('/api/' + path, { method: opt.method || (body ? 'POST' : 'GET'), headers: h, body }); }
  catch (e) { setPill('err', 'Server not running'); throw new Error('Cannot reach the sERP server. Is it still running?'); }
  if (opt.raw) { if (!r.ok) throw new Error((await r.json()).error); return r; }
  const j = await r.json().catch(() => ({ error: 'Bad response (' + r.status + ')' }));
  if (!r.ok) { const e = new Error(j.error || ('Error ' + r.status)); e.details = j.details; e.code = j.code; throw e; }
  return j;
}
function toast(msg, kind = '') {
  const t = document.createElement('div'); t.className = 'toast glass ' + kind; t.textContent = msg;
  $('#toasts').append(t); setTimeout(() => t.remove(), kind === 'err' ? 7000 : 3500);
}
const fail = e => toast(e.message || String(e), 'err');
async function run(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); } catch (e) { fail(e); } finally { if (btn) btn.disabled = false; }
}
function modal(html, cls = '') {
  const back = document.createElement('div'); back.className = 'mback';
  back.innerHTML = `<div class="modal glass ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.append(back);
  const onKey = e => { if (e.key === 'Escape' && back === [...document.querySelectorAll('.mback')].at(-1)) { e.stopPropagation(); close(); } };
  const close = () => { back.remove(); document.removeEventListener('keydown', onKey, true); };
  back.addEventListener('mousedown', e => { if (e.target === back) close(); });
  document.addEventListener('keydown', onKey, true);
  $$('[data-close]', back).forEach(b => b.onclick = close);
  back.firstElementChild.tabIndex = -1;
  setTimeout(() => { const f = $('input:not([type=hidden]):not([readonly]),select,textarea', back); (f || back.firstElementChild).focus(); }, 30);
  return { el: back.firstElementChild, close };
}
const confirmBox = (msg) => new Promise(res => {
  const m = modal(`<div class="phead"><b>Please confirm</b></div><p style="line-height:1.6;margin:0">${esc(msg)}</p><div class="mfoot"><button class="b sm" data-no>Cancel</button><button class="b sm primary" data-yes>Continue</button></div>`);
  $('[data-no]', m.el).onclick = () => { m.close(); res(false); };
  $('[data-yes]', m.el).onclick = () => { m.close(); res(true); };
  setTimeout(() => $('[data-yes]', m.el).focus(), 40);
});
const promptBox = (title, label, def = '') => new Promise(res => {
  const m = modal(`<div class="phead"><b>${esc(title)}</b><button class="xbtn" data-close>×</button></div><div class="fgrid two"><label class="full">${esc(label)}<input id="pv" value="${esc(def)}"></label></div><div class="mfoot"><button class="b sm" data-close>Cancel</button><button class="b sm primary" id="pok">OK</button></div>`);
  const ok = () => { const v = $('#pv', m.el).value; m.close(); res(v); };
  $('#pok', m.el).onclick = ok; $('#pv', m.el).onkeydown = e => { if (e.key === 'Enter') ok(); };
});

async function loadDash() { DASH = await api('dashboard?as_of=' + asOf()); renderHero(); renderDash(); }
function barChart(series) {
  const W = 640, H = 210, pl = 54, pb = 26, pt = 10;
  const max = Math.max(1, ...series.flatMap(s => [Number(s.revenue), Number(s.expense)]));
  const nice = Math.pow(10, Math.floor(Math.log10(max))); const top = Math.ceil(max / nice) * nice;
  const gw = (W - pl - 10) / Math.max(series.length, 1), bw = Math.min(34, gw / 3.2);
  let g = '';
  for (let i = 0; i <= 4; i++) { const y = pt + (H - pt - pb) * (1 - i / 4); g += `<line x1="${pl}" x2="${W - 6}" y1="${y}" y2="${y}" stroke="var(--line-2)" stroke-dasharray="${i ? '3 4' : ''}"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${m0(top * i / 4)}</text>`; }
  series.forEach((s, i) => {
    const x0 = pl + gw * i + gw / 2; const h1 = (H - pt - pb) * Number(s.revenue) / top, h2 = (H - pt - pb) * Number(s.expense) / top;
    g += `<rect x="${x0 - bw - 2}" y="${H - pb - h1}" width="${bw}" height="${Math.max(h1, 0)}" rx="5" fill="url(#gRev)"><title>Revenue ${money(s.revenue)}</title></rect>`;
    g += `<rect x="${x0 + 2}" y="${H - pb - h2}" width="${bw}" height="${Math.max(h2, 0)}" rx="5" fill="url(#gExp)"><title>Expenses ${money(s.expense)}</title></rect>`;
    g += `<text x="${x0}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${s.period}${s.status !== 'open' ? ' ·' + s.status[0] : ''}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue and expenses by month"><defs><linearGradient id="gRev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c-rev)"/><stop offset="1" stop-color="var(--c-rev2)"/></linearGradient><linearGradient id="gExp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c-exp)"/><stop offset="1" stop-color="var(--c-exp2)"/></linearGradient></defs>${g}</svg>`;
}

function wireGo(root) {

  $$('[data-act]', $('#tBody')).forEach(b => { const d = b.closest('[data-code]'); b.onclick = () => ruleAction(b, d.dataset.code, +d.dataset.ver, b.dataset.act); });

}
function taxIO() {
  $('#tBody').innerHTML = `<div class="pad" style="max-width:980px">
  <div class="dgrid" style="padding:0"><div class="card c5"><h3>Export the rule set</h3><p class="pnote" style="margin-top:0">Download every rule, version and test case. Give the file to Claude (or an accountant) together with the law change. Both formats carry the same rules and the same checksum.</p>
  <div class="actions"><button class="b sm primary" data-exp="json">${ICON.dl}JSON</button><button class="b sm line" data-exp="xlsx">${ICON.dl}Excel (.xlsx)</button></div>
  <div class="ph2">Suggested message to Claude</div><div class="formula" id="tPrompt">Here is our tax rule export. [Describe the law change and paste the source link.] Please add new draft versions with effective dates, update the test cases, fill change_summary and legal_reference, and return the file in the same format.</div><div class="actions"><button class="b xs line" id="tCopy">Copy text</button></div></div>
  <div class="card c7"><h3>Import an updated file</h3><label class="drop" id="tDrop"><input type="file" id="tFile" accept=".json,.xlsx" hidden><b>Drop the updated .json or .xlsx here</b>or click to choose a file. sERP checks it first and shows every change — nothing is applied until you confirm.</label><div id="tRes"></div></div></div></div>`;
  $$('[data-exp]', $('#tBody')).forEach(b => b.onclick = () => run(b, async () => {
    const r = await api('tax/export?fmt=' + b.dataset.exp, { raw: true });
    const name = (r.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/)?.[1] || 'tax_rules.' + b.dataset.exp;
    const url = URL.createObjectURL(await r.blob()); const a = document.createElement('a'); a.href = url; a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Exported ' + name, 'good');
  }));
  $('#tCopy').onclick = () => { navigator.clipboard?.writeText($('#tPrompt').textContent); toast('Copied', 'good'); };
  const drop = $('#tDrop'), inp = $('#tFile');
  let file = null;
  const check = async (apply) => {
    if (!file) return;
    $('#tRes').innerHTML = '<div class="pnote">Checking…</div>';
    try {
      const r = await api(`tax/import?name=${encodeURIComponent(file.name)}${apply ? '&apply=1' : ''}`, { body: await file.arrayBuffer() });
      const add = c => c.trim().startsWith('+') ? ' add' : '';
      $('#tRes').innerHTML = `<div class="ph2">${esc(r.file)} ${r.applied ? '<span class="chip ok">applied as draft · batch ' + r.batch + '</span>' : r.errors.length ? '<span class="chip bad">' + r.errors.length + ' error(s) — cannot import</span>' : '<span class="chip acc">ready to import</span>'}</div>
      ${r.change_summary ? `<div class="pnote"><b>Change summary:</b> ${esc(r.change_summary)}</div>` : ''}
      <div class="msgs">${r.errors.map(e => `<div class="e">${esc(e)}</div>`).join('')}${r.warnings.map(e => `<div class="w">${esc(e)}</div>`).join('')}${r.changes.map(c => `<div class="c${add(c)}">${esc(c)}</div>`).join('') || (r.errors.length ? '' : '<div class="c">No changes compared with the current rules.</div>')}</div>
      ${!r.applied && !r.errors.length && r.changes.length ? `<div class="actions"><button class="b sm primary" id="tApply">${ICON.up}Import as drafts</button><span class="pnote" style="margin:6px">New versions start as drafts and still need submit + approval.</span></div>` : ''}
      ${r.applied ? `<div class="actions"><button class="b sm line" id="tGoWork">Go to Approvals</button></div>` : ''}`;
      $('#tApply') && ($('#tApply').onclick = e => run(e.currentTarget, async () => { await check(true); TAXCACHE = null; refreshHero(); }));
      $('#tGoWork') && ($('#tGoWork').onclick = () => { ui.taxKind = 'work'; save(); loadTax(); });
    } catch (e) { $('#tRes').innerHTML = `<div class="msgs"><div class="e">${esc(e.message)}</div>${(e.details?.errors || []).map(x => `<div class="e">${esc(x)}</div>`).join('')}</div>`; }
  };
  inp.onchange = () => { file = inp.files[0]; check(false); };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); file = e.dataTransfer.files[0]; check(false); };
}
async function taxPolicies() {
  const p = (await api('tax/policies')).policies;
  const roles = ['finance_manager', 'md', 'tax_admin', 'accountant'];
  $('#tBody').innerHTML = `<div class="pad" style="max-width:1000px"><table class="grid"><thead><tr><th>Tax type</th><th>Approvals needed</th><th>Who may approve</th><th>Remind after (days)</th><th>Back-dating into closed periods</th><th></th></tr></thead><tbody>
  ${Object.entries(p).map(([c, x]) => `<tr data-cat="${c}"><td><b>${esc(CATN[c])}</b> <span class="tag">${c}</span>${x.approval?.company_specific ? ' <span class="chip acc plain">company</span>' : ' <span class="th2">default</span>'}</td>
  <td style="width:130px"><select data-k="req">${[1, 2, 3].map(n => `<option${x.approval?.required_approvals === n ? ' selected' : ''}>${n}</option>`).join('')}</select></td>
  <td>${roles.map(r => `<label class="ck" style="display:inline-flex!important;margin-right:10px"><input type="checkbox" data-role="${r}" ${(x.approval?.approver_roles || []).includes(r) ? 'checked' : ''}>${r.replace('_', ' ')}</label>`).join('')}</td>

  <td style="width:220px"><select data-k="retro">${[['block', 'Block'], ['adjust_next_period', 'Adjust in next period'], ['recalculate_reopen', 'Reopen and recalculate']].map(([v, l]) => `<option value="${v}"${x.retro?.mode === v ? ' selected' : ''}>${l}</option>`).join('')}</select></td>
  <td><button class="b xs line" data-savep>Save</button></td></tr>`).join('')}</tbody></table>
  <div class="pnote">Changes apply to this company and are written to the change log. Only the managing director or finance manager can change policies. Approvers can never approve their own changes, whatever is set here.</div></div>`;
  $$('[data-savep]', $('#tBody')).forEach(b => b.onclick = () => run(b, async () => {

    await api('tax/policies', { method: 'PUT', body: { kind: 'retro', category: cat, mode: $('[data-k=retro]', tr).value } });
    toast(`${cat} policy saved`, 'good'); taxPolicies();
  }));
}
async function taxLog() {
  const r = await api('tax/log');
  const brief = l => { const n = l.new_value || {}, o = l.old_value || {}; if (l.object_type === 'tax_rule_version') return `v${n.version_no ?? o.version_no} ${o.status && n.status && o.status !== n.status ? o.status + ' → ' + n.status : (n.status || o.status || '')}${o.effective_to !== n.effective_to && l.action === 'update' ? ' · end ' + (o.effective_to || 'open') + ' → ' + (n.effective_to || 'open') : ''}`; if (l.object_type === 'tax_rule_approval') return `${n.approver} ${n.decision}`; if (l.object_type === 'employee_tax_profile') return JSON.stringify(n.allowances || {}); if (l.object_type === 'tax_recalc_run') return `${n.status} · ${n.mode}`; return n.category ? `${n.category} ${n.mode || ((n.required_approvals || '') + ' approval(s)')}` : ''; };
  $('#tBody').innerHTML = `<div class="pad"><h3 style="margin:0 0 10px;font:650 15px var(--display)">Imports</h3><table class="grid"><thead><tr><th>#</th><th>File</th><th>When</th><th>By</th><th>Result</th><th>Change summary</th></tr></thead><tbody>${r.imports.map(i => `<tr><td>${i.batch_id}</td><td>${esc(i.file_name)} <span class="tag">${i.file_format}</span></td><td>${fts(i.imported_at)}</td><td>${esc(i.imported_by)}</td><td>${chip(i.result === 'rejected' ? 'rejected' : 'applied', i.result)}</td><td class="muted">${esc(i.change_summary || '')}</td></tr>`).join('')}</tbody></table>
  <h3 style="margin:22px 0 10px;font:650 15px var(--display)">Change log</h3><table class="grid"><thead><tr><th>When</th><th>Who</th><th>Object</th><th>Action</th><th>Detail</th><th>Reason</th></tr></thead><tbody>${r.log.map(l => `<tr><td>${fts(l.at)}</td><td>${esc(l.actor || '–')}</td><td><span class="tag">${esc(l.object_type.replace('tax_', '').replace(/_/g, ' '))}</span> ${esc(l.object_id)}</td><td>${esc(l.action)}</td><td>${esc(brief(l))}</td><td class="muted">${esc(l.reason || '')}</td></tr>`).join('')}</tbody></table></div>`;
}

let REP = null;
async function loadReports() {
  $$('#repSeg button').forEach(b => b.classList.toggle('on', b.dataset.k === ui.repKind));
  const k = ui.repKind;
  if (!$('#rTo').value) $('#rTo').value = asOf();
  if (!$('#rFrom').value) { const p = META.periods.find(p => asOf() >= p.start_date && asOf() <= p.end_date); $('#rFrom').value = p ? p.start_date : asOf().slice(0, 8) + '01'; }
  $('#rFrom').hidden = $('#rFromL').hidden = k !== 'pl';
  $('#rTo').disabled = k === 'tax';
  const qs = k === 'tb' ? 'date=' + $('#rTo').value : k === 'pl' ? `from=${$('#rFrom').value}&to=${$('#rTo').value}` : k === 'bs' ? 'to=' + $('#rTo').value : '';
  REP = await api(`reports/${k}?${qs}`);
  const co = esc(META.company.name_en);
  if (k === 'tb') {
    const d = REP.rows.reduce((a, r) => a + Number(r.dr_balance), 0), c = REP.rows.reduce((a, r) => a + Number(r.cr_balance), 0);
    $('#rBody').innerHTML = `<div class="shead"><h2>Trial balance</h2><span class="muted">${co} · as of ${fdate(REP.date)}</span><span class="sp"></span>${Math.abs(d - c) < .005 ? '<span class="chip ok">balanced</span>' : '<span class="chip bad">not balanced</span>'}</div><table class="grid"><thead><tr><th>Account</th><th>Name</th><th>Type</th><th class="r">Total debit</th><th class="r">Total credit</th><th class="r">Debit balance</th><th class="r">Credit balance</th></tr></thead><tbody>${REP.rows.map(r => `<tr><td class="code">${r.account_code}</td><td>${esc(r.name_en)} <span class="th2">${esc(r.name_th || '')}</span></td><td><span class="tag">${r.account_type}</span></td><td class="r">${amt(r.debit)}</td><td class="r">${amt(r.credit)}</td><td class="r">${amt(r.dr_balance)}</td><td class="r">${amt(r.cr_balance)}</td></tr>`).join('')}<tr class="tot"><td colspan="5">Total</td><td class="r">${money(d)}</td><td class="r">${money(c)}</td></tr></tbody></table>`;
  } else if (k === 'pl' || k === 'bs') {
    const groups = k === 'pl' ? [['revenue', 'Revenue'], ['expense', 'Expenses']] : [['asset', 'Assets'], ['liability', 'Liabilities'], ['equity', 'Equity']];
    const sum = t => REP.rows.filter(r => r.account_type === t).reduce((a, r) => a + Number(r.amount), 0);
    const assetSum = REP.rows.filter(r => r.account_type === 'asset').reduce((a, r) => a + Number(r.amount) * (r.normal_side === 'C' ? -1 : 1), 0);
    let body = '';
    for (const [t, l] of groups) {
      const rs = REP.rows.filter(r => r.account_type === t);
      const tot = t === 'asset' ? assetSum : sum(t);
      body += `<tr class="sub"><td colspan="2">${l}</td><td></td></tr>` + rs.map(r => `<tr><td class="code" style="padding-left:22px">${r.account_code}</td><td>${esc(r.name_en)} <span class="th2">${esc(r.name_th || '')}</span></td><td class="r">${t === 'asset' && r.normal_side === 'C' ? '(' + money(r.amount) + ')' : money(r.amount)}</td></tr>`).join('') + `<tr><td></td><td><b>Total ${l.toLowerCase()}</b></td><td class="r"><b>${money(tot)}</b></td></tr>`;
    }
    const net = k === 'pl' ? sum('revenue') - sum('expense') : assetSum - sum('liability') - sum('equity');
    $('#rBody').innerHTML = `<div class="shead"><h2>${k === 'pl' ? 'Profit &amp; loss' : 'Balance sheet'}</h2><span class="muted">${co} · ${k === 'pl' ? fdate(REP.from) + ' – ' + fdate(REP.to) : 'as of ' + fdate(REP.to)}</span><span class="sp"></span>${k === 'bs' ? (Math.abs(net) < .005 ? '<span class="chip ok">assets = liabilities + equity</span>' : `<span class="chip bad">difference ${money(net)}</span>`) : ''}</div><table class="grid" style="max-width:900px"><thead><tr><th style="width:110px">Account</th><th>Name</th><th class="r">Amount</th></tr></thead><tbody>${body}${k === 'pl' ? `<tr class="tot"><td></td><td>Net profit</td><td class="r" style="color:${net < 0 ? 'var(--danger)' : 'inherit'}">${money(net)}</td></tr>` : ''}</tbody></table>`;
  } else {
    $('#rBody').innerHTML = `<div class="shead"><h2>Tax summary by period</h2><span class="muted">${co}</span></div><table class="grid"><thead><tr><th>Period</th><th>Status</th><th class="r">Output VAT</th><th class="r">Input VAT</th><th class="r">VAT payable (PP30)</th><th class="r">Gross salary</th><th class="r">PND1</th><th class="r">Social security</th><th class="r">PND3/53 withheld</th><th class="r">Tax withheld by customers</th></tr></thead><tbody>${REP.rows.map(r => `<tr><td><b>${r.period}</b></td><td>${chip(r.status)}</td><td class="r">${amt(r.output_vat)}</td><td class="r">${amt(r.input_vat)}</td><td class="r"><b>${amt(r.vat_payable)}</b></td><td class="r">${amt(r.gross_salary)}</td><td class="r">${amt(r.pnd1)}</td><td class="r">${amt(r.sso)}</td><td class="r">${amt(r.pnd3_53)}</td><td class="r">${amt(r.wht_suffered)}</td></tr>`).join('')}</tbody></table><div class="pnote pad">Payroll figures include posted runs only. VAT payable is output VAT minus input VAT recorded in the period.</div>`;
  }
}
function exportCsv() {
  const t = $('#rBody table'); if (!t) return;
  const rowsCsv = $$('tr', t).map(tr => $$('th,td', tr).map(c => '"' + c.innerText.replace(/"/g, '""').replace(/\n/g, ' ') + '"').join(','));

const LOADERS = { dash: loadDash, journal: loadJournal, docs: loadDocs, payroll: loadPayroll, tax: loadTax, reports: loadReports };
function setTab(t) {
  ui.tab = t; save();
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $$('.view').forEach(v => v.hidden = v.id !== 'v-' + t);

}
async function refreshHero() {
  try { DASH = await api('dashboard?as_of=' + asOf()); renderHero(); if (ui.tab === 'dash') renderDash(); } catch (e) { fail(e); }
  try { if (!TAXCACHE) { TAXCACHE = await api('tax/rules?date=' + asOf()); } renderRing(); } catch (e) { }
}
async function refresh() {
  try { META = await api('meta'); } catch (e) { return fail(e); }
  TAXCACHE = null; await refreshHero();
  if (ui.tab !== 'dash') setTab(ui.tab);
}
async function boot() {
  applyTheme();
  setPill('busy', 'Connecting…');
  let st;
  try { st = STATUS = await api('status'); } catch (e) { setPill('err', 'Server not running'); return toast(e.message, 'err'); }
  if (!st.configured || st.db !== 'ok' || !st.schema) { setPill('err', st.db === 'error' ? 'Database error' : 'Not set up'); return showSetup(st); }
  setPill('ok', st.dsn?.match(/dbname=(\S+)/)?.[1] || 'PostgreSQL');
  $('#dbPill').title = `${st.db_version}\n${st.dsn}`;
  META = await api('meta').catch(fail); if (!META) return;
  $('#userSel').innerHTML = META.users.filter(u => !u.roles.includes('system')).map(u => `<option value="${u.username}" title="${esc(u.roles.join(', '))}">${esc(u.full_name.replace(/ \(.*\)$/, ''))} · ${esc(u.roles[0].replace('_', ' '))}</option>`).join('');
  if (!META.users.find(u => u.username === ui.user)) ui.user = 'napat';
  $('#userSel').value = ui.user;
  $('#asOf').value = asOf();
  await refreshHero();
  setTab(ui.tab);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $$('.pop').forEach(p => p.hidden = true); }
  if (e.key === 'F1') { e.preventDefault(); openHelp(); }
  if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && e.code === 'KeyR')) { e.preventDefault(); refresh(); }
  if (e.altKey && !e.ctrlKey && /^Digit[1-6]$/.test(e.code)) { e.preventDefault(); setTab(['dash', 'journal', 'docs', 'payroll', 'tax', 'reports'][+e.code.slice(5) - 1]); }
  if (e.altKey && !e.ctrlKey && e.code === 'KeyN' && !document.querySelector('.mback')) { e.preventDefault(); ({ journal: newJe, docs: () => ui.docKind !== 'PAY' && newInvoice(ui.docKind), payroll: newRun })[ui.tab]?.(); }
});
